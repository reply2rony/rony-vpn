# Rony VPN — build the debug APK on GitHub Actions (free for public repos).
# Runs on every push to main. The APK is uploaded as the `app-debug`
# workflow artifact (download it from the run page; requires a GitHub login).
# Note: gradle-wrapper.jar is intentionally NOT in this repo (it is a binary),
# so the workflow installs Gradle 9.7.1 and regenerates the wrapper first.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;37.0.0" "ndk;30.0.14904198" "cmake;3.22.1"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.7.1

      - name: Regenerate Gradle wrapper
        run: |
          cd source
          gradle wrapper --gradle-version 9.7.1
          chmod +x gradlew

      - name: Build debug APK
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

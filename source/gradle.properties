# Rony VPN — Gradle settings.
# Sensible defaults for a normal machine / Android Studio build.
# (The build VM used leaner values — -Xmx512m, daemon off, single-threaded —
# because it had ~500MB RAM free; those are NOT needed on a normal machine.)
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.incremental=true
